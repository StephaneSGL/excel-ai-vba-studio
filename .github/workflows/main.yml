name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate manifest, build, and package contents
        run: npm run validate

  vba-writeback-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'

      - name: Install locked dependencies
        run: npm ci

      - name: Validate and test the bundled VBA helper
        run: |
          npm run validate:vba-writeback
          npm run test:package-signatures
          npm run test:vba-writeback
          npm run test:vba-atomic

      - name: Rebuild the VBA helper from pinned source
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-vba-writeback.ps1

      - name: Record source-built helper digest
        shell: pwsh
        run: |
          $digest = (Get-FileHash -Algorithm SHA256 bin/win32-x64/excel-ai-vba-writeback.exe).Hash
          "Source-built helper SHA-256: ``$digest``" >> $env:GITHUB_STEP_SUMMARY

      - name: Test the source-built VBA helper
        run: |
          npm run validate:vba-writeback
          npm run test:package-signatures
          npm run test:vba-writeback
          npm run test:vba-atomic

      - name: Upload tested VBA helper candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vba-writeback-helper-${{ github.sha }}
          path: bin/win32-x64/excel-ai-vba-writeback.exe
          if-no-files-found: error
          retention-days: 7
