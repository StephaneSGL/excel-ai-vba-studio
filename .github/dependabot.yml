version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 6
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "deps"
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      runtime-patches:
        dependency-type: production
        update-types:
          - patch
